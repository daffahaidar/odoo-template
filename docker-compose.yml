name: odoo-18

services:
  postgres:
    container_name: postgres-service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    container_name: odoo-service
    image: odoo:18
    command: odoo --dev=qweb,xml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: postgres
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom:/mnt/extra-addons
      - ./enterprise:/mnt/enterprise
      - ./log:/var/log/odoo/
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
